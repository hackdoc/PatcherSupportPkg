name: CI - Upload Binaries

on:
  push:
  workflow_dispatch:
  release:
    types: [published]

concurrency:
    cancel-in-progress: true
    group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}

jobs:
  build_mojave:
    name: Zip and Upload Binaries
    runs-on: macos-26-intel
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: apple-actions/import-codesign-certs@8f3fb608891dd2244cdab3d69cd68c0d37a7fe93
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}
      - name: Clean and strip binaries
        run: python3 ci.py
      - name: Tag folder
        run: touch Universal-Binaries/.signed
      - name: Build DMG
        run:  python3.13 Generate-DMG.command --sign
      - name: Generate Checksums
        run: shasum -a 256 Universal-Binaries.dmg > sha256sum.txt
      - run: |
          mkdir deploy
          mv *.dmg sha256sum.txt deploy/
      - name: Create Pre-Release on Push
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: deploy/*
          tag_name: 2.0.1
          name: 2.0.1
          body: ${{ github.event.head_commit.message }}
          prerelease: false
          generate_release_notes: true
          
      - name: Upload to Release
        if: github.event_name == 'release'
        uses: svenstaro/upload-release-action@1beeb572c19a9242f4361f4cee78f8e0d9aec5df
        with:
          file: deploy/*
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file_glob: true